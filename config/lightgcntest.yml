reader:
  loading_strategy: dataset
  data_type: transaction
  reading_method: local
  local_path: datasets/lastfm_emotion_gemini/lastfm_emotion_gemini.inter
  rating_type: implicit
  sep: '\t'
  labels:
    user_id_label: user_id:token
    item_id_label: track_id:token
    rating_label: rating:float
    timestamp_label: timestamp:float
  dtypes:
    user_id_type: int64
    item_id_type: int64
    rating_type: float32
    timestamp_type: float64
writer:
  dataset_name: lastfm_emotion_gemini
  writing_method: local
  local_experiment_path: experiment/haltgrand/lastfm_emotion_gemini
  save_split: True
filtering:
  # HALT-GRAND requires a k-core graph with k>=2 (every user/item node needs an
  # excess degree nu-1 >= 1). IterativeKCore iterates UserMin/ItemMin to a fixed
  # point, i.e. a true k-core, on the FULL dataset, BEFORE splitting.
  #
  # min_interactions must be above the bare minimum of 2: WarpRec's
  # temporal_holdout split below keeps, per user, only the earliest
  # floor(n_interactions * (1 - ratio)) rows in train. A user sitting exactly at
  # the 2-core boundary (n=2) would keep floor(2*0.9)=1 in train, dropping back
  # below degree 2 even though the pre-split dataset was a valid 2-core (and
  # item degree isn't protected by this per-user split at all). min_interactions:
  # 3 keeps floor(3*0.9)=2 per user in train, the smallest safe margin.
  #
  # amazon_digital_music is extremely sparse (avg. degree ~1.3 pre-filter): the
  # k-core survival curve collapses fast with k (measured on the raw file):
  #   k=2 -> 3871 users / 3530 items / 10669 edges
  #   k=3 ->  250 users /  313 items /  1234 edges  (item degree is NOT protected
  #             by temporal_holdout's per-user truncation, so some items can
  #             still drop below degree 2 in train even at this margin)
  #   k=5 ->   20 users /   29 items /   157 edges  <- used here, for a wide
  #             margin (floor(5*0.9)=4 kept per user, avg item degree ~5.4)
  IterativeKCore:
    min_interactions: 10
splitter:
  test_splitting:
    strategy: random_holdout
    ratio: 0.1
models:
  # Models used in the design pipeline are expected to have one value per
  # hyperparameter (no search space).
  LightGCN:
    early_stopping:
      monitor: score
      patience: 20
      grace_period: 20
    embedding_size: 64 #[64, 128, 256, 512]
    n_layers: 3
    reg_weight: 0.0001
    batch_size: 4096
    epochs: 300
    learning_rate: 0.001
evaluation:
  full_evaluation_on_report: True
  validation_metric: nDCG@10
  top_k: [10]
  metrics: [nDCG, Recall, EPC, Gini]
  strategy: full
  batch_size: 1024
  seed: 42
general:
  device: cuda
  cuda_visible_devices: [0]
  time_report: False
