reader:
  loading_strategy: dataset
  data_type: transaction
  reading_method: local
  local_path: datasets/lastfm_emotion_gemini/lastfm_emotion_gemini.inter
  rating_type: implicit
  sep: '\t'
  labels:
    user_id_label: user_id:token
    item_id_label: track_id:token
    rating_label: rating:float
    timestamp_label: timestamp:float
  dtypes:
    user_id_type: int64
    item_id_type: int64
    rating_type: float32
    timestamp_type: float64
writer:
  dataset_name: lastfm_emotion_gemini
  writing_method: local
  local_experiment_path: experiment/haltgrand/alpha_fixed
  save_split: True
filtering:
  IterativeKCore:
    min_interactions: 10
splitter:
  test_splitting:
    strategy: random_holdout
    ratio: 0.1
models:
  # Run A: alpha_mode=fixed, alpha_init=1.5 -- alpha is a frozen constant,
  # never optimized. Compare against haltgrand_alpha_trainable_capped.yml
  # (Run B) to see whether a capped, still-trainable alpha keeps k_bar
  # dispersion/Spearman(k_bar, degree) as stable over epochs as a truly
  # fixed alpha does, versus an uncapped alpha that is free to drift.
  HALTGRAND:
    optimization:
      strategy: grid
      device: cuda
      parallel_trials: 1
      checkpoint_to_keep: 1
    early_stopping:
      monitor: score
      patience: 20
      grace_period: 20
    embedding_size: 64
    n_layers: [6]
    diffusion_step: 0.0
    eps_delta: 0.5
    n_probes: 20
    n_anchors: 32
    temperature: 0.2
    gamma: 20.0
    lambda0: 0.0001
    lambda_ponder: 0.0
    lambda_unif: 0.1
    reg_weight: [0.01]
    alpha_mode: fixed
    alpha_init: 1.5
    batch_size: 4096
    epochs: 300
    learning_rate: 0.001
evaluation:
  full_evaluation_on_report: True
  validation_metric: nDCG@10
  top_k: [10]
  metrics: [nDCG, Recall, EPC, Gini]
  strategy: full
  batch_size: 1024
  seed: 42
general:
  device: cuda
  cuda_visible_devices: [0]
  time_report: False
